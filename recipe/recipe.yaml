schema_version: 1

context:
  version: "1.0.1"

package:
  name: flet-platform-assets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flet-platform-assets/flet_platform_assets-${{ version }}.tar.gz
  sha256: c01e5fa1055d3fae72b8b783a4c9c5c393dede0fd575613097660c1a2d3598a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=11.3.0

tests:
  - python:
      imports:
        - flet_platform_assets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Generate app icons and splash screens for every platform Flet builds for
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://flet.dev
  documentation: https://flet.dev/docs
  repository: https://github.com/flet-dev/flet/tree/main/sdk/python/packages/flet-platform-assets

extra:
  recipe-maintainers:
    - thewchan
