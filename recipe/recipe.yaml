schema_version: 1

context:
  version: "1.0.3"

package:
  name: flet-platform-assets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flet-platform-assets/flet_platform_assets-${{ version }}.tar.gz
  sha256: 2aa1cae9769e60f1e259da71e64edc8da2247df81a4b73025b0b7dd63f36e82c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=11.3.0

tests:
  - python:
      imports:
        - flet_platform_assets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Generate app icons and splash screens for every platform Flet builds for
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://flet.dev
  documentation: https://flet.dev/docs
  repository: https://github.com/flet-dev/flet/tree/main/sdk/python/packages/flet-platform-assets

extra:
  recipe-maintainers:
    - thewchan
